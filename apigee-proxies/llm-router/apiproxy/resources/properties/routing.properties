# Default Routing Mappings
model_simple=gemini-3.5-flash-lite
model_standard=gemini-3.5-flash
model_complex=gemini-3.1-pro-preview
model_coding=gemini-2.5-pro

# Rules Engine Fallback Strategy (when classification fails or confidence is too low)
default_tier=standard

# Vertex AI Settings
project=YOUR_PROJECT_ID
location=us-central1

# Vertex AI MaaS (open models served by Google, OpenAI-compatible chat/completions endpoint).
# maas_models: comma-separated allow-list of <short id>|<publisher model id>. Clients use the short id
# (x-preferred-model[-tier]); the publisher id is sent in the OpenAI "model" field.
# Add more MaaS models (DeepSeek, Qwen, Llama...) here without code changes. Each must be enabled in Model Garden.
maas_location=global
maas_models=glm-5.2|zai-org/glm-5.2-maas
# Reasoning models think before they answer: raise max_tokens to at least this value so the answer is not empty.
# Measured on GLM 5.2: complex architecture prompts used ~3.5k-7.5k tokens (reasoning + answer) at ~90 tokens/s.
# 16384 gives ~2x headroom over the worst case seen; target and UI timeouts are 180 s to match.
maas_min_max_tokens=16384

# Anthropic Messages facade (/llm-router/anthropic) for coding agents such as Claude Code.
# facade_models: <id clients use>|<kind>|<backend model>|<label>, comma-separated (no commas in labels).
#   kind: maas (reasoning off) | maas-thinking (reasoning on) | gemini | claude
# Which of these a caller may use is set per API product (product attribute "allowed_models").
facade_models=glm-5.2|maas|zai-org/glm-5.2-maas|GLM 5.2 (fast - Vertex AI MaaS),glm-5.2-thinking|maas-thinking|zai-org/glm-5.2-maas|GLM 5.2 Thinking (Vertex AI MaaS),gemini-3.5-flash|gemini|gemini-3.5-flash|Gemini 3.5 Flash,gemini-3.5-flash-lite|gemini|gemini-3.5-flash-lite|Gemini 3.5 Flash-Lite,claude-sonnet-4-5@20250929|claude|claude-sonnet-4-5@20250929|Claude Sonnet 4.5 (Vertex AI)
# Failover candidates (first one that is on the caller's allow-list and is not the failed model).
facade_failover_models=gemini-3.5-flash,gemini-3.5-flash-lite
# Output token caps per backend (Claude Code asks for up to 32k).
facade_maas_max_tokens=32768
facade_gemini_max_tokens=65536
# Send GLM/Gemini reasoning back to Claude Code as "thinking" blocks (visible with Ctrl+O in the CLI).
facade_emit_thinking=false

# Reasoning Effort mappings (for Pro models)
# e.g., 'minimal', 'low', 'medium', 'high', 'default'
thinking_complex=high
thinking_coding=medium

# Thresholds for heuristic routing logic (in JS-DecideRoute)
min_confidence=0.5
# Model failover: backup Gemini model per tier (Vertex AI), used when the chosen model returns an error.
failover_enabled=true
failover_simple=gemini-3.5-flash
failover_standard=gemini-3.5-flash-lite
failover_complex=gemini-2.5-pro
failover_coding=gemini-3.1-pro-preview
# Demo only: honour the x-simulate-outage header (forces the chosen model's call to fail).
allow_outage_simulation=true
