# Default Routing Mappings
model_simple=gemini-3.5-flash-lite
model_standard=gemini-3.5-flash
model_complex=gemini-3.1-pro-preview
model_coding=gemini-2.5-pro

# Rules Engine Fallback Strategy (when classification fails or confidence is too low)
default_tier=standard

# Vertex AI Settings
project=YOUR_PROJECT_ID
location=us-central1

# Reasoning Effort mappings (for Pro models)
# e.g., 'minimal', 'low', 'medium', 'high', 'default'
thinking_complex=high
thinking_coding=medium

# Thresholds for heuristic routing logic (in JS-DecideRoute)
min_confidence=0.5
# Model failover: backup Gemini model per tier (Vertex AI), used when the chosen model returns an error.
failover_enabled=true
failover_simple=gemini-3.5-flash
failover_standard=gemini-3.5-flash-lite
failover_complex=gemini-2.5-pro
failover_coding=gemini-3.1-pro-preview
# Demo only: honour the x-simulate-outage header (forces the chosen model's call to fail).
allow_outage_simulation=true
